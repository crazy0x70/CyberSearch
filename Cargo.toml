[package]
name = "cybersearch"
version = "0.0.3"
edition = "2024"
rust-version = "1.88"
description = "A Rust MCP server that aggregates multiple web search providers"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "search", "grok", "brave", "gemini"]
categories = ["command-line-utilities", "web-programming"]

[features]
default = []
http = [
    "dep:axum",
    "rmcp/transport-streamable-http-server",
    "tokio/net",
    "tokio/signal",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "gzip", "brotli"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"] }
schemars = "1"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
